# Bingepick web target + JS gates. See README.md -> "Running with Docker".
#
#   docker compose up web          the app on http://localhost:3005
#   docker compose run --rm test   jest
#   docker compose run --rm tsc    tsc --noEmit
#   docker compose run --rm apk    an Android APK
#
# Everything but `web` sits behind a profile, so a bare `docker compose up`
# starts the app and nothing else; `docker compose run` activates the profile of
# whatever service you name.

x-app: &app
  build:
    context: .
    target: dev
  image: bingepick-web:dev
  volumes:
    - .:/app
    # Anonymous volume, deliberately: it keeps the image's Linux-built
    # node_modules visible under the bind mount above, which would otherwise
    # shadow them with the host's macOS-built tree. Rebuilding after a
    # package.json change therefore needs `docker compose down -v` first.
    - /app/node_modules

services:
  web:
    <<: *app
    ports:
      - "${WEB_PORT:-3005}:3005"
    environment:
      # Defaults to the host the app has always used. Override to follow the
      # backend if it moves again (it has once already: :8000 -> :80).
      BACKEND_URL: ${BACKEND_URL:-http://188.166.155.92}
      # Bind mounts routinely drop the inotify events webpack watches for, so
      # poll instead. Set WATCH_POLL=0 to turn polling off.
      WATCH_POLL: ${WATCH_POLL:-1000}
    stdin_open: true
    tty: true

  test:
    <<: *app
    profiles: ["tools"]
    command: npx jest

  tsc:
    <<: *app
    profiles: ["tools"]
    command: npx tsc --noEmit

  # Not built from *app: it needs the JDK/SDK image and its own volume set, and
  # a YAML merge would replace the volume list rather than extend it anyway.
  apk:
    build:
      context: .
      target: android
    image: bingepick-android:dev
    profiles: ["android"]
    environment:
      # Release produces a standalone, signed APK. Debug skips JS bundling, so a
      # debug APK will not launch without Metro reachable from the device.
      ANDROID_VARIANT: ${ANDROID_VARIANT:-Release}
      # Two ABIs by default: arm64-v8a for real devices, x86_64 for emulators.
      # Each extra ABI is a full native compile, so this is the build-time knob
      # that matters most.
      ANDROID_ABIS: ${ANDROID_ABIS:-arm64-v8a,x86_64}
      # Single dash: ANDROID_NDK_VERSION= (empty) deliberately skips the ~2.5GB
      # NDK install, rather than falling back to the default.
      ANDROID_NDK_VERSION: ${ANDROID_NDK_VERSION-27.1.12297006}
    volumes:
      # NOTE: the checkout is deliberately NOT bind-mounted here, unlike every
      # other service. The host's android/build holds an autolinking cache full
      # of macOS absolute paths (/Users/...), and android/.gradle likewise —
      # mounting them makes Gradle configure ':react-native-svg' against a
      # directory that does not exist inside the container, and the build dies.
      # Source therefore comes from the image, which .dockerignore already
      # filters clean, so use `--build` to pick up edits.
      - ./dist-apk:/app/dist-apk
      - android-sdk:/opt/android-sdk
      - gradle-cache:/root/.gradle
      # Keep Gradle's state across runs so rebuilds stay incremental. All three
      # matter: android/.gradle holds the task execution history that up-to-date
      # checks read, and without it Gradle re-runs all 245 tasks every time even
      # though the outputs in android/build are still sitting there.
      - android-dot-gradle:/app/android/.gradle
      - android-build:/app/android/build
      - android-app-build:/app/android/app/build

volumes:
  # Named rather than anonymous so they are greppable and individually
  # reclaimable: `docker volume rm bingepick-android-sdk` frees several GB.
  android-sdk:
    name: bingepick-android-sdk
  gradle-cache:
    name: bingepick-gradle-cache
  android-dot-gradle:
    name: bingepick-android-dot-gradle
  android-build:
    name: bingepick-android-build
  android-app-build:
    name: bingepick-android-app-build
